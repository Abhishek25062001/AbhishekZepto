name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Secret leak check
        run: npm run check:secrets

      - name: Frontend secret check
        run: npm run check:frontend-secrets

      - name: Backend dependency audit
        run: npm run audit:backend

      - name: Web panels dependency audit
        run: npm run audit:web

      # Mobile audit may be allowed to warn in Phase 1 if the React Native
      # dependency tree has known advisories.
