name: zepto-local

services:
  mongodb:
    image: mongo:7
    container_name: zepto-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-api:
    container_name: zepto-backend-api
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_PORT: 5000
      APP_VERSION: 1.0.0
      DB_MONGO_URI: mongodb://mongodb:27017/zepto_like_dev
    ports:
      - "5000:5000"

volumes:
  mongodb_data:
